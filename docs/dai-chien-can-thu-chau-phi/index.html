setTimeout(()=>{closeModal();if(steal){let t=state.teams[state.stolenBy];if(ok){t.score+=Math.round(pts*.6)+10;t.fish.push(state.fish.id);flash('⚔️ GIÀNH CÁ THÀNH CÔNG!')}else flash('CÁ ĐÃ THOÁT!');finishTurn();return}
let team=state.teams[state.turn%state.teams.length];if(ok){team.correct++;team.combo++;state.pointsPending=pts+(team.combo%3===0?30:0);if(state.boss){team.score+=pts;state.bossCorrect[team.id]=(state.bossCorrect[team.id]||0)+1;flash('+'+pts+' ĐIỂM');finishTurn()}else pullStart()}else{team.combo=0;if(state.boss){finishTurn()}else stealOffer()}},1300)}
function stealOffer(){state.phase='steal';let current=state.teams[state.turn%state.teams.length];let all=state.teams.filter(t=>t.id!==current.id);let html='<header><h2>⚔️ CƠ HỘI GIÀNH CÁ</h2></header><p class="question">'+safe(current.name)+' trả lời chưa đúng! Tổ nào muốn giành con cá '+safe(state.fish.name)+'?</p><div class="answers">'+all.map(t=>'<button class="btn" data-steal="'+t.id+'">'+safe(t.name)+'</button>').join('')+'</div><div class="actionline" style="margin-top:14px">'+btn('Bỏ qua – chuyển lượt','skip','red')+'</div>';modal(html);document.querySelectorAll('[data-steal]').forEach(b=>b.onclick=()=>{state.stolenBy=+b.dataset.steal;state.q=pickQuestion();showQuestion(true)})}
function pullStart(){state.phase='pull';state.pull=0;state.pullAttempts=0;state.tension=50;let t=state.teams[state.turn%state.teams.length];modal('<header><h2>🎣 KÉO CÁ VỀ THUYỀN!</h2><span class="tag">'+safe(t.name)+'</span></header><p class="question">Bấm KÉO khi kim nằm trong <b>vùng XANH</b>. Đủ 3 nhịp là bắt được cá. Có tối đa 7 lần thử.</p><div class="gauge"><div class="needle" id="needle" style="left:50%"></div></div><p class="muted">Tiến độ kéo cá</p><div class="progress"><div id="pullbar" style="width:0%"></div></div><div class="actionline" style="margin-top:23px">'+btn('🎣 KÉO NGAY!','pull','orange')+'</div><p class="tip" id="pullinfo">Nhịp kéo tốt: 0/3</p>');
clearInterval(state.pullInterval);state.pullInterval=setInterval(()=>{state.tension=50+50*Math.sin(Date.now()/360);if(ref('needle'))ref('needle').style.left=state.tension+'%'},45)}
function pull(){if(state.phase!=='pull')return;state.pullAttempts++;let good=state.tension>=30&&state.tension<=70;if(good){state.pull++;bubbles();flash('🎣 CHUẨN!')}else flash('🌊 TRƯỢT NHỊP');if(ref('pullbar'))ref('pullbar').style.width=(state.pull/3*100)+'%';if(ref('pullinfo'))ref('pullinfo').textContent='Nhịp tốt: '+state.pull+'/3 · Đã thử: '+state.pullAttempts+'/7';if(state.pull>=3||state.pullAttempts>=7){clearInterval(state.pullInterval);setTimeout(()=>{closeModal();let t=state.teams[state.turn%state.teams.length];t.score+=state.pointsPending;if(state.pull>=3){t.score+=(state.fish.rare?20:state.fish.rank==='lạ'?10:5);t.fish.push(state.fish.id);flash('🐟 BẮT CÁ THÀNH CÔNG!')}else flash('🐟 CÁ SỔNG – GIỮ ĐIỂM KIẾN THỨC');finishTurn()},900)}}
function finishTurn(){state.phase='idle';state.fish=null;state.q=null;if(state.boss){state.bossTurn++;if(state.bossTurn>=state.teams.length*3){state.teams.forEach(t=>{if((state.bossCorrect[t.id]||0)===3)t.score+=100});state.screen='result';renderResults();return}state.turn=state.bossTurn%state.teams.length}else{state.turn++;if(state.turn>=state.rounds*state.teams.length){state.boss=true;state.bossTurn=0;state.turn=0;flash('🐉 VÒNG CUỐI!')}}state.scene=Math.floor(state.turn/Math.max(1,state.teams.length))%3;renderGame()}
function start(){saveSetupFields();state.teams.forEach(t=>{t.name=(t.name||'Tổ '+(t.id+1)).trim();t.player=(t.player||'Cần thủ').trim();t.score=0;t.fish=[];t.combo=0;t.correct=0});state.turn=0;state.boss=false;state.bossTurn=0;state.bossCorrect={};state.played=new Set();state.kind=0;state.phase='idle';state.fish=null;state.screen='game';renderGame()}
function end(){if(state.screen!=='game')return;modal('<header><h2>🏁 KẾT THÚC TRẬN?</h2></header><p class="question">Bạn muốn kết thúc sớm và xem bảng xếp hạng hiện tại không?</p><div class="actionline">'+btn('Tiếp tục chơi','close','green')+btn('Kết thúc trận','confirmend','red')+'</div>')}
function resultsCsv(){let x='STT,Tên tổ,Tên cần thủ,Điểm,Đáp án đúng,Số cá\n'+state.teams.slice().sort((a,b)=>b.score-a.score).map((t,i)=>[i+1,'"'+t.name.replace(/"/g,'""')+'"','"'+t.player.replace(/"/g,'""')+'"',t.score,t.correct,t.fish.length].join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+x],{type:'text/csv;charset=utf-8'}));a.download='bang-diem-dai-chien-can-thu-chau-phi.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function renderResults(){let sorted=state.teams.slice().sort((a,b)=>b.score-a.score);root.innerHTML=shell(nav()+'<div class="panel pale" style="max-width:960px;width:100%;margin:20px auto"><h1 style="text-align:center;color:#b86d0a;font-size:clamp(24px,4vw,46px)">🏆 KẾT QUẢ ĐẠI CHIẾN 🏆</h1><p style="text-align:center;font-size:21px;margin:10px">Chúc mừng '+safe(sorted[0].name)+'!</p><table class="resulttable">'+sorted.map((t,i)=>'<tr><td>'+(i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.')+'</td><td>'+avatars[t.avatar]+' <b>'+safe(t.name)+'</b> <small>'+safe(t.player)+'</small></td><td><b>'+t.score+' điểm</b></td><td>🐟 '+t.fish.length+'</td></tr>').join('')+'</table><div class="actionline" style="margin-top:17px">'+btn('⬇ Xuất bảng điểm CSV','csv','green')+btn('↺ Chơi trận mới','setup','orange')+btn('⌂ Trang chủ','home')+'</div></div>')}
function library(){state.screen='library';let card=fish.map(f=>'<div class="fishcard">'+fishSVG(f)+'<b>'+f.id+'</b><small>'+safe(f.name)+' · '+(f.rare?'✨ HIẾM':f.rank)+'</small></div>').join('');root.innerHTML=shell(nav()+'<div class="panel"><h2>🐟 BỘ SƯU TẬP 60 MẪU CÁ</h2><p class="muted">Mẫu vẽ tương tác được tạo trực tiếp bằng SVG, không phải ảnh WebP 2.5D đã duyệt trong bộ ZIP.</p><div class="librarygrid">'+card+'</div><div class="actionline" style="margin-top:12px">'+btn('🎣 Trở lại trận đấu','back','orange')+btn('⌂ Trang chủ','home')+'</div></div>')}
function handle(action){if(action==='home'){closeModal();state.screen='home';home()}else if(action==='setup'){closeModal();setup()}else if(action==='rules')showRules();else if(action==='start')start();else if(action==='cast')cast();else if(action==='pull')pull();else if(action==='skip'){closeModal();finishTurn()}else if(action==='checkmatch')checkmatch();else if(action==='end')end();else if(action==='confirmend'){closeModal();state.screen='result';renderResults()}else if(action==='close')closeModal();else if(action==='full'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()}else if(action==='fx'){state.fx=!state.fx;let s=state.screen; if(s==='home')home();else if(s==='game')renderGame();else if(s==='setup')renderSetup();else if(s==='result')renderResults();else if(s==='library')library();else showRules()}else if(action==='library'){state.prev=state.screen;library()}else if(action==='back'){state.screen=state.prev==='game'?'game':'home';if(state.screen==='game')renderGame();else home()}else if(action==='csv')resultsCsv()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(b)handle(b.dataset.act)});document.addEventListener('keydown',e=>{if(e.code==='Space'&&state.phase==='pull'){e.preventDefault();pull()}if(e.key==='Escape'&&ref('modals')&&!state.questionAnswered&&state.modal!=='question')closeModal()});
home();
})();
</script></body></html>

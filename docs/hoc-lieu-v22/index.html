/* V2.3 · Ưu tiên màn hình TV nhỏ và SGK phóng to */
.book-workspace.preview-grid{grid-template-columns:minmax(0,2.7fr) minmax(270px,.85fr);gap:13px;align-items:stretch}
.book-workspace .book-primary-panel{padding:12px}
.book-workspace .book-settings{padding:17px}
.book-workspace .reader{height:max(560px,calc(100dvh - 260px));min-height:560px}
.book-workspace .reader-head{gap:7px;padding:9px 11px;flex-wrap:wrap}
.book-workspace .reader-head .btn{font-size:14px;min-height:43px;padding:9px 12px;white-space:nowrap}
.book-workspace .reader-head .book-file-select{width:clamp(150px,16vw,250px);max-width:250px;font-size:14px;min-height:43px}
.book-page-label,.book-zoom-label{font-size:17px;font-weight:900;white-space:nowrap;color:#153e51}
.book-quality-pill{font-weight:800;font-size:12px;color:#a64b2e;max-width:235px}
.book-hint{background:#f3f9f9;color:#376679;text-align:left;padding:7px 15px;font-size:13px;line-height:1.45}
.book-workspace .viewer{display:block;text-align:center;padding:12px;min-height:300px;overscroll-behavior:contain}
.book-workspace .pageholder{display:block;width:max-content;max-width:none;margin:0 auto;line-height:0}
.book-workspace #pagecontent img{image-rendering:auto}
svg.inklayer{width:100%;height:100%;position:absolute;inset:0;}.book-workspace .inklayer .region-select{stroke:#058b97;stroke-width:.55;fill:#00a9bb20;stroke-dasharray:1.2 1;vector-effect:non-scaling-stroke}
.book-workspace .reader-info{font-size:13px;padding:9px 12px}
.book-workspace .book-settings .sub{font-size:15px;line-height:1.58}
.book-workspace .book-settings h3{font-size:19px}
.book-focus-only{display:none}
.book-crisp .book-workspace #pagecontent img,.stage-crisp.stage-book #stageBookHolder img{filter:url(#book-clarity-filter) contrast(1.14) brightness(1.025);}
body.book-focus{overflow:hidden}
body.book-focus .app{height:100dvh;overflow:hidden}
body.book-focus .top,body.book-focus .side{display:none!important}
body.book-focus .shell{display:block!important;height:100dvh;min-height:0}
body.book-focus .main{padding:0!important;margin:0!important;height:100dvh;max-width:none!important;overflow:hidden}
body.book-focus .main>.libraryhead{display:none!important}
body.book-focus .book-workspace{display:block!important;gap:0;height:100dvh}
body.book-focus .book-settings{display:none!important}
body.book-focus .book-primary-panel{height:100dvh;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;box-shadow:none!important}
body.book-focus .book-workspace .reader{height:100dvh;min-height:0;border:0;border-radius:0}
body.book-focus .book-workspace .reader-head{background:#f8fbfc;border-bottom:2px solid #b7d4dc;padding:8px 12px;gap:9px;min-height:62px}
body.book-focus .book-workspace .reader-head .btn{font-size:15px;min-height:43px;padding:8px 10px}
body.book-focus .book-workspace .reader-head .book-file-select{font-size:16px;max-width:230px}
body.book-focus .book-workspace .book-hint{font-size:14px;padding:6px 13px}
body.book-focus .book-workspace .viewer{height:auto;min-height:0;flex:1;padding:8px}
body.book-focus .book-workspace .reader-info{display:none}
body.book-focus .book-focus-only{display:inline-flex;align-items:center}
body.book-focus .book-quality-pill{max-width:210px;font-size:11px}
.stage-pdf.stage-book{display:flex;flex-direction:column;align-items:stretch;justify-content:stretch;overflow:hidden}
.stage-book-toolbar{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;padding:7px 9px;min-height:48px;background:#f0f7f9;border-bottom:1px solid #ccdfe5;z-index:3}
.stage-book-toolbar .btn{padding:7px 13px;font-size:16px}

.stage-book-toolbar span{font-size:13px;color:#537b87}
.stage-book-scroller{position:relative;flex:1;min-height:0;min-width:0;overflow:auto;display:block;padding:8px;overscroll-behavior:contain;text-align:center}

.stage-book #stageBookHolder img,.stage-book #stageBookHolder canvas{display:block;max-width:none;max-height:none;object-fit:unset}

const state={bookFocus:false,bookClarity:false,regionMode:false,regionStart:null,regionEnd:null,bookToken:0,stageZoom:1,lessons:[],active:null,view:'library',db:null,pendingImport:null,answerImport:null,setupTab:'details',selectedBank:'',presentation:false,scenes:[],slideIndex:0,visibleNotes:0,matched:{},filled:{},checked:false,pdf:{doc:null,bytes:null,lib:null},imageURL:null,page:1,zoom:1,drawMode:false,drawStart:null,drawTemp:null,ocrText:'',ocrBusy:false,saveTimer:null,stagePdf:null};

function dbInit(){return new Promise((resolve,reject)=>{let req=indexedDB.open('hoclieu-studio-v22',1);req.onupgradeneeded=()=>{let d=req.result;if(!d.objectStoreNames.contains('lessons'))d.createObjectStore('lessons',{keyPath:'id'});if(!d.objectStoreNames.contains('assets'))d.createObjectStore('assets',{keyPath:'key'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function dbOp(store,mode,fn){return new Promise((resolve,reject)=>{const tx=state.db.transaction(store,mode),os=tx.objectStore(store);let ret=fn(os);tx.oncomplete=()=>resolve(ret?.result);tx.onerror=()=>reject(tx.error)})}
async function putAsset(key,blob){await dbOp('assets','readwrite',os=>os.put({key,blob}))}
async function getAsset(key){let r=await dbOp('assets','readonly',os=>os.get(key));return r?.blob||null}
async function delAsset(key){await dbOp('assets','readwrite',os=>os.delete(key))}
async function saveLesson(immediate=false){let l=selected();if(!l)return;if(immediate){clearTimeout(state.saveTimer);await dbOp('lessons','readwrite',os=>os.put(clone(l)));$('statusText').textContent='✓ Đã lưu trong trình duyệt';return}clearTimeout(state.saveTimer);$('statusText').textContent='Đang lưu…';state.saveTimer=setTimeout(()=>saveLesson(true).catch(e=>toast('Không lưu được: '+e.message)),400)}
async function hydrate(){state.db=await dbInit();let data=await dbOp('lessons','readonly',os=>os.getAll());state.lessons=data||[];if(!state.lessons.length){let sample=clone(SAMPLE);sample.id='bai9chauphi';state.lessons=[sample];state.active=sample.id;await saveLesson(true)}else{state.active=localStorage.getItem('v22-active')||state.lessons[0].id}if(!selected())state.active=state.lessons[0]?.id;setView('library')}

function pageAnswerEditor(l){let p=state.pendingImport||l,matching=p.matching||{left:[],right:[],answers:{}},fill=p.fills||[];return `<section class="panel"><div class="libraryhead"><div><h2>Đối chiếu đáp án trước khi chiếu</h2><p class="sub">Đáp án chỉ được công bố ở chế độ dạy khi giáo viên bấm kiểm tra hoặc hiện đáp án.</p></div><div class="actions"><button class="btn" id="commitSheet">✓ Xác nhận dùng bộ phiếu này</button></div></div><label class="filezone" style="margin:12px 0"><b>⇧ Tải tệp đáp án Word (.docx)</b><small>Đọc tệp đáp án khi đang kiểm tra bảng, không cần quay về trang tải file.</small><input id="answerFileReview" type="file" accept=".docx" /></label><h3>Nối cột</h3><div class="scrollx"><table class="tighttable"><thead><tr><th>Ý cần nối</th><th>Chọn chữ cái đúng</th><th>Nội dung đáp án</th></tr></thead><tbody>${matching.left.map(([num,text])=>`<tr><td><b>${esc(num)}.</b> ${esc(text)}</td><td><select class="field" data-matchans="${esc(num)}"><option value="">— Chưa có —</option>${matching.right.map(([a,t])=>`<option value="${esc(a)}" ${matching.answers?.[num]===a?'selected':''}>${esc(a)}</option>`)}</select></td><td>${esc((matching.right.find(x=>x[0]===matching.answers?.[num])||[])[1]||'')}</td></tr>`).join('')}</tbody></table></div>${fill.map((f,fi)=>`<h3>Câu ${fi+2} – ${esc(f.title)}</h3><p class="sub">Từ khóa: ${f.bank.map(x=>esc(x)).join(' · ')}</p><div class="formgrid">${Object.keys(f.answers).sort((a,b)=>+a-+b).map(id=>`<div class="form"><label>Ô (${id})</label><input class="field" data-fillans="${fi}|${id}" value="${esc(f.answers[id]||'')}"></div>`).join('')}</div>`).join('')}<div class="actions" style="margin-top:20px"><button class="btn" id="commitSheet2">✓ Xác nhận và lưu đáp án</button></div></section>`}

function pageSheet(){let l=selected();return head('Hoạt động trên lớp','Phiếu học tập tương tác','Có thể sửa trực tiếp câu hỏi, đáp án và ngân hàng từ trước khi trình chiếu.',buttonBar())+`<div class="panel"><div class="libraryhead"><h2>Câu 1 · Nối cột</h2><div class="actions"><button class="btn ghost sm" id="addLeft">＋ Ý cột A</button><button class="btn ghost sm" id="addRight">＋ Ý cột B</button></div></div><div class="formgrid"><div><h3>Cột A</h3>${l.matching.left.map(([n,t],i)=>`<div class="row" style="margin:7px 0"><span style="padding:12px 0;font-weight:900">${esc(n)}</span><input class="field grow" data-left="${i}" value="${esc(t)}"><button class="btn ghost sm" data-delleft="${i}">×</button></div>`).join('')}</div><div><h3>Cột B (có thể chứa phương án nhiễu)</h3>${l.matching.right.map(([n,t],i)=>`<div class="row" style="margin:7px 0"><span style="padding:12px 0;font-weight:900">${esc(n)}</span><input class="field grow" data-right="${i}" value="${esc(t)}"><button class="btn ghost sm" data-delright="${i}">×</button></div>`).join('')}</div></div></div>${l.fills.map((f,fi)=>`<div class="panel"><div class="libraryhead"><h2>Câu ${fi+2} · ${esc(f.title)}</h2><button class="btn ghost sm" data-addsentence="${fi}">＋ Thêm nhận định</button></div><div class="form"><label>Ngân hàng từ khóa (phân cách bằng dấu |)</label><textarea class="field" rows="2" data-bank="${fi}">${esc(f.bank.join(' | '))}</textarea></div><div style="margin-top:12px">${f.sentences.map((s,i)=>`<div class="row" style="margin:7px 0;align-items:center"><span style="font-weight:800">${i+1}.</span><textarea class="field grow" rows="2" data-sentence="${fi}|${i}">${esc(s)}</textarea><button class="btn ghost sm" data-delsentence="${fi}|${i}">×</button></div>`).join('')}</div></div>`).join('')}<div class="actions"><button class="btn" id="saveSheet">✓ Lưu phiếu</button><button class="btn ghost" id="addFill">＋ Thêm dạng điền từ</button><button class="btn ghost" data-goto="setup" data-settab="answers">Kiểm tra bảng đáp án</button></div>`}
function pageBook(){let l=selected();return head('Sách giáo khoa','SGK sắc nét · Phóng vùng chữ · TV siêu to','Xem đúng tài liệu gốc, phóng lớn đoạn cần dạy; độ nét tối đa phụ thuộc file gốc.',buttonBar())+`<div class="preview-grid book-workspace"><section class="panel book-primary-panel" style="margin-top:0"><div class="reader" id="bookReader"><div class="reader-head"><button class="btn gold sm" id="focusBook" title="Ẩn toàn bộ menu để chiếu SGK toàn màn hình">${state.bookFocus?'↩ THOÁT SIÊU TO':'⛶ SGK SIÊU TO'}</button><select class="field book-file-select" id="assetPicker" aria-label="Chọn file sách">${l.assets.length?l.assets.map((a,i)=>`<option value="${i}" ${state.assetIndex===i?'selected':''}>${esc(a.name)}</option>`):'<option>Chưa có tệp SGK</option>'}</select><button class="btn ghost sm" id="prevPage" title="Trang trước">‹</button><span id="pageLabel" class="book-page-label">Trang ${state.page}</span><button class="btn ghost sm" id="nextPage" title="Trang sau">›</button><button class="btn ghost sm" id="zoomOut" title="Thu nhỏ">−</button><span id="zoomLabel" class="book-zoom-label">${Math.round(state.zoom*100)}%</span><button class="btn ghost sm" id="zoomIn" title="Phóng to">＋</button><button class="btn ghost sm" id="fitWidthBook" title="Hiển thị vừa chiều ngang">↔ Vừa ngang</button><button class="btn ghost sm" id="zoomRegionBook" title="Khoanh vùng chữ để phóng to">▧ Phóng vùng</button><button class="btn ghost sm" id="clarityBook" title="Tăng độ tương phản và độ rõ của ảnh scan">◐ ${state.bookClarity?'Tắt tăng rõ':'Tăng rõ'}</button><span class="book-quality-pill" id="bookQuality"></span><button class="btn ghost sm book-focus-only" id="focusPen">✎ Bút</button><button class="btn ghost sm book-focus-only" id="focusPlayInk">▶ Nét gạch</button><button class="btn ghost sm book-focus-only" id="focusUndoInk">↶ Hoàn tác</button></div><div class="book-hint">Kéo thanh cuộn để xem trang lớn · Chọn <b>Phóng vùng</b> rồi khoanh đoạn chữ · Chọn <b>Bút</b> để gạch chân đúng dòng.</div><div class="viewer" id="viewer"><div class="pageholder" id="pageholder"><div id="pagecontent"></div><svg class="inklayer" id="inklayer" viewBox="0 0 100 100" preserveAspectRatio="none"></svg></div></div><div class="reader-info" id="resolutionNotice">Giữ đúng tỉ lệ trang SGK; file ảnh nhỏ không thể phục hồi chi tiết mất nét.</div></div></section><section class="panel book-settings" style="margin-top:0"><h2>Công cụ giáo viên</h2><p class="sub">Muốn chiếu trên TV nhỏ, bấm <b>SGK SIÊU TO</b>. Khung sách sẽ chiếm gần toàn bộ màn hình, cuộn tới đoạn cần dạy và phóng từng vùng chữ.</p><div class="notice book-quality-notice">☀ <b>Tăng rõ ảnh:</b> chỉ làm nổi chữ và giảm cảm giác nhòe. Ảnh SGK quá ít điểm ảnh không thể trở thành bản in sắc nét; hãy ưu tiên PDF gốc hoặc ảnh chụp ở độ phân giải cao.</div><h3>Bút gạch thông minh</h3><p class="sub">Chọn Bút gạch rồi kéo chuột từ trái sang phải. Nét được lưu theo tọa độ trang, hiển thị đúng chỗ khi phóng to.</p><div class="actions"><button id="togglePen" class="btn ${state.drawMode?'gold':'ghost'}">✎ ${state.drawMode?'Đang dùng bút':'Bật bút gạch'}</button><button id="playInk" class="btn ghost">▶ Chạy hiệu ứng</button><button id="undoInk" class="btn ghost">↶ Hoàn tác</button><button id="clearInk" class="btn warn">Xóa nét trang này</button></div><hr class="hr"><h3>Nhận diện chữ để làm bản chữ to</h3><p class="sub">OCR ảnh sách (cần mạng). Giáo viên duyệt lại chữ, dấu tiếng Việt và số liệu trước khi chuyển sang bảng ý chính chữ lớn.</p><button class="btn ghost" id="runOCR">◎ Nhận diện chữ trang này</button><textarea class="field" id="ocrText" rows="6" style="margin-top:12px" placeholder="Văn bản nhận dạng hoặc chữ đã kiểm tra sẽ xuất hiện ở đây…">${esc(state.ocrText)}</textarea><div class="actions" style="margin-top:9px"><button class="btn ghost sm" id="ocrToNotes">＋ Đưa chữ đã kiểm tra sang ý SGK</button></div></section></div>`}
function pageNotes(){let l=selected();return head('Chuẩn hóa kiến thức','Bảng ý chính SGK','Mỗi ý là một dòng riêng, chữ lớn; gạch ý xuất hiện theo từng nhịp để học sinh theo dõi.',buttonBar())+`<div class="notice">Bạn có thể trích các ý từ SGK nhưng luôn kiểm tra lại nội dung với tài liệu gốc trước khi dạy. Từ hoặc cụm cần gạch chân đặt trong <b>**hai dấu sao**</b>.</div><div class="actions" style="margin:17px 0"><button class="btn" id="addNote">＋ Tạo mục kiến thức</button><button class="btn ghost" data-goto="book">▣ Xem SGK gốc</button></div>${l.notes.map((n,i)=>`<div class="notecard"><div class="row"><div class="form grow"><label>Tiêu đề mục ${i+1}</label><input class="field" data-notetitle="${i}" value="${esc(n.title)}"></div><div class="form" style="width:160px"><label>Trang SGK liên kết</label><input class="field" data-notepage="${i}" value="${esc(n.page||'')}" placeholder="VD: 42"></div></div><div class="form"><label>Gạch đầu dòng (mỗi dòng một ý, không quá dài)</label><textarea class="field" rows="${Math.max(3,n.points.length+1)}" data-notebody="${i}">${esc(n.points.join('\n'))}</textarea></div><div class="actions"><button class="btn ghost sm" data-delnotes="${i}">Xóa mục này</button></div></div>`).join('')}<button class="btn" id="saveNotes">✓ Lưu ý chính</button>`}
function pageStory(){let l=selected(),sc=activeScenes();return head('Dẫn dắt bài học','Kịch bản trình chiếu','Sắp thứ tự các phân cảnh; dữ liệu tương tác, SGK và nét gạch đều đi theo bài học.',buttonBar())+`<div class="notice">Đề xuất trình tự: khám phá → quan sát SGK → gạch trọng tâm → hoàn thành phiếu → chốt kiến thức. Nhấn lên/xuống để đổi thứ tự.</div><div class="panel"><h2>Phân cảnh của bài</h2>${sc.map((s,i)=>`<div class="scene"><div><span class="tag">Cảnh ${String(i+1).padStart(2,'0')}</span> <strong>${esc(s.title)}</strong><small>${esc({match:'Nối cột',fill:'Điền từ',notes:'Chốt ý SGK',book:'Xem SGK',quiz:'Trắc nghiệm'}[s.type]||s.type)}</small>${s.type==='book'?`<div class="row" style="align-items:center;margin-top:9px"><select class="field" style="max-width:235px" data-sceneasset="${i}">${l.assets.map((a,j)=>`<option value="${j}" ${(s.assetIndex||0)===j?'selected':''}>${esc(a.name)}</option>`).join('')}</select><label style="font-size:12px">Trang <input class="field" style="width:85px" type="number" min="1" value="${s.page||1}" data-scenepage="${i}"/></label></div>`:''}</div><div class="actions"><button class="btn ghost sm" data-move="${i}|-1" ${i===0?'disabled':''}>↑</button><button class="btn ghost sm" data-move="${i}|1" ${i===sc.length-1?'disabled':''}>↓</button><button class="btn ghost sm" data-deletedscene="${i}">×</button></div></div>`).join('')}<div class="actions" style="margin-top:13px"><button class="btn ghost" id="addBookScene">＋ Cảnh SGK</button><button class="btn ghost" id="resetScenes">↺ Tạo lại từ hoạt động</button><button class="btn" data-teach>▶ Kiểm tra trình chiếu</button></div></div>`}
function bindCommon(){qsa('[data-goto]').forEach(x=>x.onclick=()=>{if(x.dataset.settab)state.setupTab=x.dataset.settab;setView(x.dataset.goto)});qsa('[data-backlib]').forEach(x=>x.onclick=()=>setView('library'));qsa('[data-teach]').forEach(x=>x.onclick=()=>teachStart());if(state.view==='library')bindLibrary();if(state.view==='setup')bindSetup();if(state.view==='sheet')bindSheet();if(state.view==='book')bindBook();if(state.view==='notes')bindNotes();if(state.view==='story')bindStory()}
function activate(id,view='setup'){state.active=id;state.page=1;state.assetIndex=0;state.zoom=1;state.bookFocus=false;state.regionMode=false;state.bookClarity=!!(state.lessons.find(x=>x.id===id)?.bookPrefs?.clarity);document.body.classList.remove('book-focus');state.pdf={doc:null,bytes:null,lib:null};state.ocrText='';localStorage.setItem('v22-active',id);state.setupTab='details';setView(view)}
function bindLibrary(){$('addLesson').onclick=async()=>{let l=makeNew();state.lessons.push(l);state.active=l.id;await saveLesson(true);activate(l.id);toast('Đã tạo không gian bài học mới. Mọi dữ liệu được lưu riêng.')};$('importBackup').onclick=()=>$('backupInput').click();$('backupInput').onchange=e=>importBackup(e.target.files[0]);qsa('[data-open]').forEach(x=>x.onclick=()=>activate(x.dataset.open));qsa('[data-teach-id]').forEach(x=>x.onclick=()=>{activate(x.dataset.teachId);teachStart()});qsa('[data-export]').forEach(x=>x.onclick=()=>backupLesson(x.dataset.export))}
function bindSetup(){let l=selected();qsa('[data-setuptab]').forEach(x=>x.onclick=()=>{state.setupTab=x.dataset.setuptab;render()});if(state.setupTab==='details'){$('saveInfo').onclick=()=>{Object.assign(l,{name:$('lessonName').value,number:$('lessonNumber').value,grade:$('lessonGrade').value,subject:$('lessonSubject').value,edition:$('lessonEdition').value,updated:Date.now()});saveLesson();render();toast('Đã lưu thông tin bài học.')};$('duplicateLesson').onclick=async()=>{let c=clone(l);c.id=uid();c.name+=' (bản sao)';c.assets=[];c.annotations={};state.lessons.push(c);activate(c.id);await saveLesson(true);toast('Đã nhân bản phiếu và ý chính. Tệp SGK phải tải lại để tránh mất liên kết.')};$('removeLesson').onclick=async()=>{if(!confirm('Xóa bài học và mọi tệp đã lưu trong bài này? Hành động không thể hoàn tác nếu chưa có bản sao lưu.'))return;for(let a of l.assets)await delAsset(a.key);await dbOp('lessons','readwrite',os=>os.delete(l.id));state.lessons=state.lessons.filter(x=>x.id!==l.id);state.active=state.lessons[0]?.id||null;setView('library');toast('Đã xóa bài học.')}}if(state.setupTab==='files'){let w=$('worksheetFile'),a=$('answerFile');w.onchange=async()=>{try{state.pendingImport=await parseWorksheet(await readDocx(w.files[0]));state.answerImport=null;state.setupTab='answers';render();toast('Đã đọc phiếu. Kiểm tra nội dung và tải đáp án Word.') }catch(e){toast('Không đọc được phiếu: '+e.message)}};a.onchange=async()=>{try{state.answerImport=parseAnswers(await readDocx(a.files[0]));applyAnswers(state.pendingImport||l,state.answerImport);state.setupTab='answers';render();toast('Đã đọc đáp án. Hãy đối chiếu trước khi xác nhận.') }catch(e){toast('Không đọc được đáp án: '+e.message)}};$('pdfFile').onchange=e=>addMaterials([...e.target.files],'pdf');$('imagesFile').onchange=e=>addMaterials([...e.target.files],'image');qsa('[data-delasset]').forEach(x=>x.onclick=async()=>{if(!confirm('Xóa tệp SGK này khỏi bài học?'))return;let [a]=l.assets.splice(+x.dataset.delasset,1);await delAsset(a.key);await saveLesson(true);render()})}if(state.setupTab==='answers'){let aReview=$('answerFileReview');if(aReview)aReview.onchange=async()=>{try{state.answerImport=parseAnswers(await readDocx(aReview.files[0]));applyAnswers(state.pendingImport||l,state.answerImport);render();toast('Đã ghép đáp án từ Word. Kiểm tra và xác nhận.')}catch(e){toast('Không đọc được đáp án: '+e.message)}};qsa('[data-matchans]').forEach(el=>el.onchange=()=>{(state.pendingImport||l).matching.answers[el.dataset.matchans]=el.value;saveLesson()});qsa('[data-fillans]').forEach(el=>el.oninput=()=>{let [fi,k]=el.dataset.fillans.split('|');(state.pendingImport||l).fills[+fi].answers[k]=el.value;if(!state.pendingImport)saveLesson()});for(const id of ['commitSheet','commitSheet2'])$(id).onclick=()=>{if(state.pendingImport){l.matching=state.pendingImport.matching;l.fills=state.pendingImport.fills;state.pendingImport=null}l.updated=Date.now();saveLesson(true);toast('Đã xác nhận và lưu bộ phiếu trong bài học.');setView('sheet')}}}
function bindSheet(){let l=selected();qsa('[data-left]').forEach(el=>el.oninput=()=>l.matching.left[+el.dataset.left][1]=el.value);qsa('[data-right]').forEach(el=>el.oninput=()=>l.matching.right[+el.dataset.right][1]=el.value);qsa('[data-bank]').forEach(el=>el.oninput=()=>l.fills[+el.dataset.bank].bank=el.value.split('|').map(x=>x.trim()).filter(Boolean));qsa('[data-sentence]').forEach(el=>el.oninput=()=>{let [f,i]=el.dataset.sentence.split('|').map(Number);l.fills[f].sentences[i]=el.value});$('saveSheet').onclick=()=>{l.updated=Date.now();saveLesson(true);toast('Đã lưu phiếu tương tác.')};$('addLeft').onclick=()=>{l.matching.left.push([String(l.matching.left.length+1),'Nhận định mới']);saveLesson();render()};$('addRight').onclick=()=>{let n=l.matching.right.length;l.matching.right.push([String.fromCharCode(65+n),'Phương án mới']);saveLesson();render()};qsa('[data-delleft]').forEach(el=>el.onclick=()=>{l.matching.left.splice(+el.dataset.delleft,1);saveLesson();render()});qsa('[data-delright]').forEach(el=>el.onclick=()=>{l.matching.right.splice(+el.dataset.delright,1);saveLesson();render()});qsa('[data-addsentence]').forEach(el=>el.onclick=()=>{l.fills[+el.dataset.addsentence].sentences.push('– Nhận định mới (1) __________.');saveLesson();render()});qsa('[data-delsentence]').forEach(el=>el.onclick=()=>{let [f,i]=el.dataset.delsentence.split('|').map(Number);l.fills[f].sentences.splice(i,1);saveLesson();render()});$('addFill').onclick=()=>{l.fills.push({title:'Nội dung mới',bank:[],sentences:[],answers:{}});saveLesson();render()}}
function bindBook(){let l=selected();if(!$('assetPicker'))return;
$('assetPicker').onchange=e=>{state.assetIndex=+e.target.value;state.page=1;state.zoom=1;state.ocrText='';state.pdf.doc=null;render()};
$('prevPage').onclick=()=>{state.page=Math.max(1,state.page-1);renderBookPage().then(()=>{$('viewer').scrollTop=0})};
$('nextPage').onclick=()=>{state.page=Math.min(state.pageCount||1,state.page+1);renderBookPage().then(()=>{$('viewer').scrollTop=0})};
$('zoomOut').onclick=()=>changeBookZoom(Math.max(.55,+(state.zoom-.25).toFixed(2)));
$('zoomIn').onclick=()=>changeBookZoom(Math.min(6,+(state.zoom+.25).toFixed(2)));
$('fitWidthBook').onclick=()=>changeBookZoom(1);
$('focusBook').onclick=()=>{state.bookFocus=!state.bookFocus;document.body.classList.toggle('book-focus',state.bookFocus);$('focusBook').textContent=state.bookFocus?'↩ THOÁT SIÊU TO':'⛶ SGK SIÊU TO';requestAnimationFrame(()=>renderBookPage().then(()=>{$('viewer').scrollTop=0;$('viewer').scrollLeft=0}))};
$('clarityBook').onclick=()=>{state.bookClarity=!state.bookClarity;document.body.classList.toggle('book-crisp',state.bookClarity);$('clarityBook').textContent='◐ '+(state.bookClarity?'Tắt tăng rõ':'Tăng rõ');l.bookPrefs={...(l.bookPrefs||{}),clarity:state.bookClarity};saveLesson()};
$('zoomRegionBook').onclick=()=>{state.regionMode=!state.regionMode;if(state.regionMode)state.drawMode=false;$('zoomRegionBook').classList.toggle('gold',state.regionMode);$('zoomRegionBook').textContent=state.regionMode?'✓ KHOANH ĐOẠN':'▧ Phóng vùng';paintInk();toast(state.regionMode?'Kéo chuột khoanh phần chữ muốn phóng siêu to.':'Đã tắt chế độ phóng vùng.')};
$('togglePen').onclick=()=>{state.drawMode=!state.drawMode;if(state.drawMode)state.regionMode=false;$('zoomRegionBook').classList.toggle('gold',state.regionMode);$('zoomRegionBook').textContent='▧ Phóng vùng';$('togglePen').textContent=state.drawMode?'✓ Đang dùng bút':'✎ Bật bút gạch';paintInk()};
$('playInk').onclick=()=>{let svg=$('inklayer');svg.classList.remove('draw');void svg.offsetWidth;svg.classList.add('draw')};
$('undoInk').onclick=()=>{let a=getAnnotations();a.pop();saveLesson();paintInk()};
$('clearInk').onclick=()=>{if(!confirm('Xóa tất cả nét gạch trong trang đang mở?'))return;let key=annotationKey();l.annotations[key]=[];saveLesson();paintInk()};
$('focusPen').onclick=()=>{$('togglePen').click();$('focusPen').classList.toggle('gold',state.drawMode)};
$('focusPlayInk').onclick=()=>$('playInk').click();$('focusUndoInk').onclick=()=>$('undoInk').click();
const svg=$('inklayer');
function pt(e){let r=svg.getBoundingClientRect();return{x:Math.max(0,Math.min(100,100*(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(100,100*(e.clientY-r.top)/r.height))}}
svg.onpointerdown=e=>{if(!state.drawMode&&!state.regionMode)return;e.preventDefault();let p=pt(e);state.drawStart=p;state.drawTemp=p;svg.setPointerCapture(e.pointerId);paintInk()};
svg.onpointermove=e=>{if(!state.drawStart)return;let p=pt(e);state.drawTemp=state.regionMode?p:{x:p.x,y:state.drawStart.y};paintInk()};
svg.onpointerup=async e=>{if(!state.drawStart)return;let a=state.drawStart,b=state.drawTemp||pt(e);state.drawStart=null;state.drawTemp=null;if(state.regionMode){const left=Math.min(a.x,b.x),right=Math.max(a.x,b.x),top=Math.min(a.y,b.y),bottom=Math.max(a.y,b.y);if(right-left>4&&bottom-top>2){const viewer=$('viewer'),holder=$('pageholder');const factor=Math.min((viewer.clientWidth*.87)/(holder.clientWidth*(right-left)/100),(viewer.clientHeight*.80)/(holder.clientHeight*(bottom-top)/100));state.zoom=Math.max(.55,Math.min(6,+(state.zoom*factor).toFixed(2)));state.regionMode=false;await renderBookPage();requestAnimationFrame(()=>{viewer.scrollLeft=Math.max(0,$('pageholder').clientWidth*(left+right)/200-viewer.clientWidth/2);viewer.scrollTop=Math.max(0,$('pageholder').clientHeight*(top+bottom)/200-viewer.clientHeight/2)})}}else if(Math.abs(b.x-a.x)>2){getAnnotations().push({...a,x2:b.x,y2:a.y});saveLesson()}paintInk()};
$('runOCR').onclick=ocrCurrent;
$('ocrToNotes').onclick=()=>{let txt=$('ocrText').value.trim();if(!txt)return toast('Chưa có văn bản được kiểm tra.');l.notes.push({title:'Ý SGK từ trang '+state.page,page:String(state.page),points:txt.split(/\n+/).map(x=>x.trim()).filter(Boolean).slice(0,15)});saveLesson();toast('Đã tạo mục ý SGK; vui lòng biên tập và đối chiếu.');setView('notes')};
$('ocrText').oninput=e=>state.ocrText=e.target.value;

function revealStep(){let s=state.scenes[state.slideIndex],l=selected();if(s.type==='notes'){state.visibleNotes=Math.min(l.notes[s.ni].points.length,state.visibleNotes+1);drawSlide()}else if(s.type==='match'){state.matched=clone(l.matching.answers);state.checked=true;drawSlide()}else if(s.type==='fill'){Object.assign(state.filled,l.fills[s.fi].answers);state.checked=true;drawSlide()}else if(s.type==='book'){let svg=qs('.stage-pdf svg');if(svg){svg.classList.remove('anim');void svg.offsetWidth;svg.classList.add('anim')}}}

async function stageChangeZoom(next){const sc=$('stageBookScroll'),holder=$('stageBookHolder');if(!sc||!holder)return;const cx=(sc.scrollLeft+sc.clientWidth/2)/Math.max(1,holder.clientWidth),cy=(sc.scrollTop+sc.clientHeight/2)/Math.max(1,holder.clientHeight);state.stageZoom=next;await renderStageBook();requestAnimationFrame(()=>{sc.scrollLeft=Math.max(0,$('stageBookHolder').clientWidth*cx-sc.clientWidth/2);sc.scrollTop=Math.max(0,$('stageBookHolder').clientHeight*cy-sc.clientHeight/2)})}
async function renderStageBook(){let l=selected(),scene=state.scenes[state.slideIndex],assetIndex=scene.assetIndex||0,pg=scene.page||1,a=l.assets[assetIndex],host=$('stagePdf'),sc=$('stageBookScroll'),holder=$('stageBookHolder');if(!host||!sc||!holder)return;if(!a){holder.innerHTML='<div class="stage-blank">Chưa tải SGK. Vào Chuẩn bị bài để thêm tài liệu.</div>';return}let blob=await getAsset(a.key);if(!blob)return;let el,basewidth=Math.max(400,sc.clientWidth-18)*(state.stageZoom||1);holder.innerHTML='';try{if(a.type==='image'){el=new Image;let url=URL.createObjectURL(blob);el.src=url;await el.decode();el.style.width=Math.round(basewidth)+'px';el.style.height='auto';el.style.maxWidth='none';el.style.maxHeight='none';holder.append(el);state.stagePageCount=1;setTimeout(()=>URL.revokeObjectURL(url),30000)}else{let lib=await pdfLib(),bytes=new Uint8Array(await blob.arrayBuffer()),doc=await lib.getDocument({data:bytes}).promise;state.stagePageCount=doc.numPages;let page=await doc.getPage(Math.min(pg,doc.numPages)),v=page.getViewport({scale:1}),viewport=page.getViewport({scale:basewidth/v.width}),r=Math.min(2.2,Math.max(1.6,window.devicePixelRatio||1),Math.sqrt(30000000/Math.max(1,viewport.width*viewport.height)));el=document.createElement('canvas');el.width=Math.round(viewport.width*r);el.height=Math.round(viewport.height*r);el.style.width=Math.round(viewport.width)+'px';el.style.height=Math.round(viewport.height)+'px';holder.append(el);await page.render({canvasContext:el.getContext('2d',{alpha:false}),viewport,transform:[r,0,0,r,0,0]}).promise}}catch(e){holder.innerHTML='<div class="stage-blank">Không thể mở SGK: '+esc(e.message)+'</div>';return}let svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('stage-ink');svg.setAttribute('viewBox','0 0 100 100');svg.setAttribute('preserveAspectRatio','none');svg.innerHTML=(l.annotations[assetIndex+':'+(a.type==='image'?1:pg)]||[]).map(p=>`<line x1="${p.x}" y1="${p.y}" x2="${p.x2}" y2="${p.y2}"/>`).join('');holder.style.width=el.offsetWidth+'px';holder.style.height=el.offsetHeight+'px';holder.append(svg);let z=$('stageZoomText');if(z)z.textContent=Math.round((state.stageZoom||1)*100)+'%';refreshStageClarity()}

$('quickTeach').onclick=teachStart;qsa('.nav').forEach(el=>el.onclick=()=>setView(el.dataset.view));window.addEventListener('beforeunload',e=>{if(state.saveTimer){/* Debounce already schedules IndexedDB writes; leaving immediately may interrupt them. */}});hydrate().catch(e=>{$('main').innerHTML=`<div class="notice warning">Không thể mở bộ nhớ trình duyệt: ${esc(e.message)}. Hãy mở trang bằng HTTPS hoặc localhost.</div>`;toast('Không mở được kho dữ liệu cục bộ.')});
</script></body></html>

name: Publish preview to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Unpack African fishing game assets
        shell: bash
        run: |
          set -euo pipefail
          GAME="docs/dai-chien-can-thu-chau-phi"
          test -f "$GAME/assets-chunk-001.bin"
          # Keep versioned source files; the packed archive is used for media assets only.
          mkdir -p "$RUNNER_TEMP/chauphi-source/data"
          for file in index.html app.js style.css; do
            cp "$GAME/$file" "$RUNNER_TEMP/chauphi-source/$file"
          done
          cp "$GAME/data/game-data.js" "$RUNNER_TEMP/chauphi-source/data/game-data.js"
          cat "$GAME"/assets-chunk-*.bin | tar -xz -C "$GAME"
          rm "$GAME"/assets-chunk-*.bin
          for file in index.html app.js style.css; do
            cp "$RUNNER_TEMP/chauphi-source/$file" "$GAME/$file"
          done
          cp "$RUNNER_TEMP/chauphi-source/data/game-data.js" "$GAME/data/game-data.js"
          test -f "$GAME/index.html"
          test -f "$GAME/app.js"
          test -f "$GAME/style.css"
          test -f "$GAME/assets/fish/F060.webp"
          test -f "$GAME/assets/effects/E100.webp"
          test -f "$GAME/assets/characters/C10.webp"
          NUM=$(find "$GAME/assets" -type f -name '*.webp' | wc -l)
          test "$NUM" -eq 213
          echo "Full game extracted with $NUM WebP assets"
      - name: Save expanded 2.5D game assets into repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          GAME="docs/dai-chien-can-thu-chau-phi"
          git add "$GAME/index.html" "$GAME/app.js" "$GAME/style.css" "$GAME/favicon.svg" "$GAME/GAME_ASSET_REPORT.json" "$GAME/data" "$GAME/assets"
          if ! git diff --cached --quiet; then
            git commit -m "Publish complete African fishing 2.5D web assets [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - id: deployment
        uses: actions/deploy-pages@v4
